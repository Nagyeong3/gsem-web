openapi: 3.1.0
info:
  title: GSEM 조회 API
  version: 0.2.0-prototype
  description: |
    지원장비 관리시스템의 프론트엔드-백엔드 조회 계약 초안입니다.
    상태값, 페이징 및 일부 필드는 프로토타입 가정이며 운영 규칙이 아닙니다.
servers:
  - url: /api/v1
    description: 배포 환경 상대 경로
tags:
  - name: Dashboard
    description: 대시보드 조회
  - name: Items
    description: 통합 관리 품목 조회
  - name: Deliveries
    description: 납품 일정 조회 초안
  - name: Changes
    description: 변경 이력 조회 초안
paths:
  /dashboard/overview:
    get:
      tags: [Dashboard]
      summary: 대시보드 통합 현황 조회
      operationId: getDashboardOverview
      responses:
        "200":
          description: 대시보드 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/DashboardOverview"
        "503":
          $ref: "#/components/responses/DataSourceUnavailable"
  /items/filter-options:
    get:
      tags: [Items]
      summary: 품목 검색 필터 선택지 조회
      operationId: getItemFilterOptions
      responses:
        "200":
          description: 필터 선택지 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ItemFilterOptions"
  /items:
    get:
      tags: [Items]
      summary: 품목 목록 통합 검색
      operationId: searchItems
      parameters:
        - name: query
          in: query
          description: 품번·국영문 품명·국영문 용도 통합 검색. 세부 검색 규칙은 미확정입니다.
          schema:
            type: string
            maxLength: 100
        - name: itemType
          in: query
          schema:
            $ref: "#/components/schemas/ItemType"
        - name: aircraftTypeCode
          in: query
          schema:
            type: string
        - name: businessId
          in: query
          schema:
            type: integer
        - name: subsystemCode
          in: query
          schema:
            type: string
        - name: categoryCode
          in: query
          schema:
            type: string
        - name: managerUserId
          in: query
          schema:
            type: integer
        - name: destinationId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ItemStatus"
        - name: sort
          in: query
          description: "정렬 필드와 방향. 예: recentChangeDate,desc"
          schema:
            type: string
            default: recentChangeDate,desc
            pattern: "^(itemNumber|itemNameKor|aircraftType|business|subsystem|category|manager|destination|status|recentChangeDate),(asc|desc)$"
        - name: page
          in: query
          description: 1부터 시작하는 페이지 번호
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 품목 검색 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedApiResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ItemSummary"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/DataSourceUnavailable"
  /items/{itemId}:
    get:
      tags: [Items]
      summary: 품목 통합 상세 조회
      operationId: getItemDetail
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: 품목 상세 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ItemDetail"
        "404":
          $ref: "#/components/responses/ItemNotFound"
  /items/{itemId}/replacement-graph:
    get:
      tags: [Items]
      summary: 대체품 계보 조회
      description: 후속 화면용 계약입니다. 사업별 대체와 관계 유효기간은 미확정입니다.
      operationId: getReplacementGraph
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: 대체품 계보 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ReplacementGraph"
        "404":
          $ref: "#/components/responses/ItemNotFound"
  /deliveries:
    get:
      tags: [Deliveries]
      summary: 납품 일정 목록 조회
      description: 후속 화면용 계약입니다. 실제 납품 단계와 지연 판정은 미확정입니다.
      operationId: searchDeliveries
      parameters:
        - name: query
          in: query
          description: 품번, 품명, 사업 또는 납지 통합 검색어
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: businessId
          in: query
          schema:
            type: integer
        - name: aircraftTypeCode
          in: query
          schema:
            type: string
        - name: destinationId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DeliveryStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 납품 일정 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedApiResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/DeliverySchedule"
  /change-events:
    get:
      tags: [Changes]
      summary: 변경 이력 목록 조회
      description: 후속 화면용 계약입니다. 변경 유형과 승인 상태는 미확정입니다.
      operationId: searchChangeEvents
      parameters:
        - name: itemId
          in: query
          schema:
            type: integer
        - name: query
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            description: 프로토타입 전송 코드
            enum: [RECEIVED, IN_REVIEW, PROCESSED]
        - name: changeType
          in: query
          schema:
            type: string
        - name: requesterUserId
          in: query
          schema:
            type: integer
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 변경 이력 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedApiResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ChangeEvent"
components:
  parameters:
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    InvalidRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    ItemNotFound:
      description: 품목을 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    DataSourceUnavailable:
      description: 데이터 소스 사용 불가
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
  schemas:
    ApiResponse:
      type: object
      required: [data]
      properties:
        data: {}
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    PagedApiResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: {}
        page:
          $ref: "#/components/schemas/PageMeta"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ResponseMeta:
      type: object
      required: [generatedAt]
      properties:
        generatedAt:
          type: string
          format: date-time
        traceId:
          type: string
        requestId:
          type: string
          description: 요청과 성공 응답을 연결하는 개발 추적 식별자
    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ApiErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            traceId:
              type: string
            fieldErrors:
              type: array
              items:
                type: object
                required: [field, reason]
                properties:
                  field:
                    type: string
                  reason:
                    type: string
    Code:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
    Destination:
      type: object
      required: [destinationId, name]
      properties:
        destinationId:
          type: integer
        name:
          type: string
    ItemType:
      type: string
      description: 코드값은 프로토타입 가정입니다.
      enum:
        - SUPPORT_EQUIPMENT
        - BASIC_ISSUE_ITEM
        - FLIGHT_GEAR_INSPECTION_EQUIPMENT
        - STANDARD
    ItemStatus:
      type: string
      description: 실제 상태값 확인이 필요합니다.
      enum: [IN_USE, REPLACEMENT_REVIEW, ON_HOLD]
    DeliveryStatus:
      type: string
      description: 납품 상태의 의미는 예정·진행·완료이며 영문 전송 코드는 API 설계값입니다.
      enum: [PLANNED, IN_PROGRESS, COMPLETED]
    ManagerAssignment:
      type: object
      required: [userId, name]
      properties:
        userId:
          type: integer
        name:
          type: string
        role:
          type: string
          description: DB에서 값이 없을 수 있습니다.
          enum: [SUPPORT_EQUIPMENT_MANAGER, PURCHASING_MANAGER]
        assignmentType:
          type: string
          description: 정·부 구분은 현재 DB 미반영 확장 후보입니다.
          enum: [PRIMARY, SECONDARY]
    Vendor:
      type: object
      required: [vendorId, name]
      properties:
        vendorId:
          type: integer
        name:
          type: string
    Business:
      type: object
      required: [businessId, name]
      properties:
        businessId:
          type: integer
        name:
          type: string
    Delivery:
      type: object
      required: [deliveryId, destination, quantity, deliveryDate, status]
      properties:
        deliveryId:
          type: integer
        destination:
          $ref: "#/components/schemas/Code"
        quantity:
          type: integer
          minimum: 0
        deliveryDate:
          type: string
          format: date
        receiptDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/DeliveryStatus"
    BusinessApplication:
      type: object
      required: [integratedInfoId, business, aircraftType, deliveries]
      properties:
        integratedInfoId:
          type: integer
        business:
          $ref: "#/components/schemas/Business"
        aircraftType:
          $ref: "#/components/schemas/Code"
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/Delivery"
    ItemSummary:
      type: object
      required:
        - itemId
        - itemNumber
        - itemNameKor
        - category
        - aircraftTypes
        - businesses
        - subsystems
        - maintenanceLevels
        - managers
        - destinations
        - status
      properties:
        itemId:
          type: integer
        itemNumber:
          type: string
        itemNameKor:
          type: string
        itemNameEng:
          type: string
        itemType:
          $ref: "#/components/schemas/ItemType"
        category:
          $ref: "#/components/schemas/Code"
        vendor:
          $ref: "#/components/schemas/Vendor"
        aircraftTypes:
          type: array
          items:
            $ref: "#/components/schemas/Code"
        businesses:
          type: array
          items:
            $ref: "#/components/schemas/Business"
        subsystems:
          type: array
          items:
            $ref: "#/components/schemas/Code"
        maintenanceLevels:
          type: array
          items:
            $ref: "#/components/schemas/Code"
        managers:
          type: array
          items:
            $ref: "#/components/schemas/ManagerAssignment"
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/Destination"
        status:
          $ref: "#/components/schemas/ItemStatus"
        recentChangeDate:
          type: string
          format: date
    ItemDetail:
      allOf:
        - $ref: "#/components/schemas/ItemSummary"
        - type: object
          required: [applications]
          properties:
            itemUsageKor:
              type: string
            itemUsageEng:
              type: string
            serd:
              type: object
              properties:
                serdNumber:
                  type: string
                size:
                  type: string
                weight:
                  type: string
                primaryUsage:
                  type: string
            qualityAssuranceType:
              $ref: "#/components/schemas/Code"
            calibration:
              type: object
              required: [required]
              properties:
                required:
                  type: boolean
                cycleMonths:
                  type: integer
                  minimum: 1
                method:
                  type: string
                  enum: [IN_HOUSE, OUTSOURCED]
                calibrationProvider:
                  type: string
            applications:
              type: array
              items:
                $ref: "#/components/schemas/BusinessApplication"
            replacementSummary:
              type: object
              required: [predecessors, successors, hasBranch]
              properties:
                predecessors:
                  type: integer
                  minimum: 0
                successors:
                  type: integer
                  minimum: 0
                hasBranch:
                  type: boolean
    ItemFilterOptions:
      type: object
      required:
        - itemTypes
        - aircraftTypes
        - businesses
        - subsystems
        - categories
        - managers
        - destinations
        - statuses
      properties:
        itemTypes:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value:
                $ref: "#/components/schemas/ItemType"
              label:
                type: string
        aircraftTypes:
          type: array
          items:
            $ref: "#/components/schemas/Code"
        businesses:
          type: array
          items:
            $ref: "#/components/schemas/Business"
        subsystems:
          type: array
          items:
            $ref: "#/components/schemas/Code"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Code"
        managers:
          type: array
          items:
            type: object
            required: [userId, name]
            properties:
              userId:
                type: integer
              name:
                type: string
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/Destination"
        statuses:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value:
                $ref: "#/components/schemas/ItemStatus"
              label:
                type: string
    DashboardOverview:
      type: object
      required: [metrics, monthlyDeliveries, recentChanges, upcomingDeliveries]
      properties:
        metrics:
          type: array
          items:
            type: object
            required: [id, label, value, unit, tone, helper]
            properties:
              id:
                type: string
                enum: [ATTENTION, REGISTERED, DELIVERY, DELAY, REPLACEMENT, APPROVAL]
              label:
                type: string
              value:
                type: integer
              unit:
                type: string
              tone:
                type: string
                enum: [BRAND, NEUTRAL, INFO, ERROR, WARNING]
              helper:
                type: string
        monthlyDeliveries:
          type: array
          items:
            type: object
            required: [month, plannedQuantity]
            properties:
              month:
                type: string
              plannedQuantity:
                type: integer
              deliveredQuantity:
                type: [integer, "null"]
              achievementRate:
                type: [number, "null"]
        recentChanges:
          type: array
          items:
            type: object
            required: [changeId, itemId, itemName, content, category, requesterName, changedAt, status]
            properties:
              changeId:
                type: string
              itemId:
                type: integer
              itemName:
                type: string
              content:
                type: string
              category:
                type: string
              requesterName:
                type: string
              changedAt:
                type: string
                format: date
              status:
                type: string
        upcomingDeliveries:
          type: array
          items:
            type: object
            required: [deliveryId, itemId, itemName, itemNumber, deliveryDate, daysLeft, status]
            properties:
              deliveryId:
                type: integer
              itemId:
                type: integer
              itemName:
                type: string
              itemNumber:
                type: string
              deliveryDate:
                type: string
                format: date
              daysLeft:
                type: integer
              status:
                type: string
    DeliverySchedule:
      type: object
      required:
        - deliveryId
        - integratedInfoId
        - item
        - business
        - aircraftType
        - destination
        - plannedQuantity
        - deliveryDate
        - status
        - managers
      properties:
        deliveryId:
          type: integer
        integratedInfoId:
          type: integer
        item:
          type: object
          required: [itemId, itemNumber, itemName]
          properties:
            itemId:
              type: integer
            itemNumber:
              type: string
            itemName:
              type: string
        business:
          $ref: "#/components/schemas/Business"
        aircraftType:
          $ref: "#/components/schemas/Code"
        destination:
          $ref: "#/components/schemas/Code"
        plannedQuantity:
          type: integer
          description: 계획 수량. 기존 ERD의 quantity에서 변환할 수 있다.
        quantity:
          type: integer
          description: 기존 ERD 및 초기 계약과의 전환용 호환 필드
        orderedQuantity:
          type: integer
        receivedQuantity:
          type: integer
        deliveredQuantity:
          type: integer
        deliveryDate:
          type: string
          format: date
        receiptDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        delayed:
          type: boolean
        managers:
          type: array
          items:
            $ref: "#/components/schemas/ManagerAssignment"
    ChangeEvent:
      type: object
      required: [changeId, item, changeType, requestedBy, requestedAt, status, differences]
      properties:
        changeId:
          type: string
        item:
          type: object
          required: [itemId, itemNumber, itemName]
          properties:
            itemId:
              type: integer
            itemNumber:
              type: string
            itemName:
              type: string
        changeType:
          type: string
        requestedBy:
          $ref: "#/components/schemas/ManagerAssignment"
        requestedAt:
          type: string
          format: date-time
        processedBy:
          $ref: "#/components/schemas/ManagerAssignment"
        processedAt:
          type: string
          format: date-time
        status:
          type: string
          description: 프로토타입 전송 코드이며 실제 처리 순서는 미확정이다.
          enum: [RECEIVED, IN_REVIEW, PROCESSED]
        reason:
          type: string
        basis:
          type: string
        differences:
          type: array
          items:
            type: object
            required: [field, label]
            properties:
              field:
                type: string
              label:
                type: string
              before:
                type: string
              after:
                type: string
    ReplacementGraph:
      type: object
      required: [rootItemId, nodes, edges]
      properties:
        rootItemId:
          type: integer
        nodes:
          type: array
          items:
            type: object
            required: [itemId, itemNumber, itemName, businesses, status]
            properties:
              itemId:
                type: integer
              itemNumber:
                type: string
              itemName:
                type: string
              businesses:
                type: array
                items:
                  type: string
              status:
                type: string
        edges:
          type: array
          items:
            type: object
            required: [relationId, sourceItemId, targetItemId]
            properties:
              relationId:
                type: string
              sourceItemId:
                type: integer
              targetItemId:
                type: integer
              businessIds:
                type: array
                items:
                  type: integer
              effectiveFrom:
                type: string
                format: date
              effectiveTo:
                type: string
                format: date
              changeId:
                type: string
              changedAt:
                type: string
                format: date
              changeType:
                type: string
              reason:
                type: string
              requestedBy:
                $ref: "#/components/schemas/ManagerAssignment"
              processedBy:
                $ref: "#/components/schemas/ManagerAssignment"
